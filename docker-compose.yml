version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: wor-postgres
    restart: always
    environment:
      POSTGRES_DB: wor_portal_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: